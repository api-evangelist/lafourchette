format: custom-envelope
rfc9457: false
note: >-
  TheFork does not use RFC 9457 problem+json. Every documented error is application/json with a
  three-field envelope, and the machine-actionable value is the string in data.code. The 4xx
  responses below are derived from the response schemas TheFork publishes per operation (each error
  schema pins error and data.code to a single-value enum, which is how the specific codes were
  recovered); 429 and 500 come from the global error section of the Getting started page. The
  response descriptions in the contract are all the boilerplate "Object with user data." — including
  on the error responses — which is a documentation defect on TheFork's side, not a transcription
  error here. The POS API v1 documents its error codes only in prose (400/401/404/415/500) and
  declares no error responses at all in its published operation objects.
envelope:
  media_type: application/json
  fields:
    statusCode: numeric HTTP status, repeated in the body
    error: HTTP reason phrase (Bad Request, Unauthorized, Not Found, Conflict)
    data.code: stable machine-readable error code; empty string on 401
  example: |
    {
      "statusCode": 401,
      "error": "Unauthorized"
    }
