note: >-
  TheFork publishes plans for TheFork Manager, the restaurant SaaS the APIs serve — not for API
  access. Neither plan carries a number: both are "ask for pricing", and the revenue model is a
  commission expressed as a percentage of the average bill per guest on reservations sourced from
  TheFork, Tripadvisor and partner sites, with bookings taken through the restaurant's own website
  and social channels commission-free. API access itself is not a purchasable line item: partners and
  POS vendors obtain credentials from integrations@thefork.com under a partner contract, and rate
  limits are set in that contract. There is no self-serve tier, no free tier and no published
  per-call pricing.
