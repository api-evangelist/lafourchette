access_pattern:
  shape: list-then-fetch
  detail: >-
    getV1Customers, getV1Reservations and getV1Reviews return arrays of UUIDs plus totalCount/page/limit
    — not objects. Every field above is only reachable through the matching /{id} detail call, so a
    full sync is 1 + N requests per page.
