note: >-
  TheFork states, in identical wording on the Getting started page and on both API introductions,
  that "rate limiting is currently enforced at the default level as outlined in your contract" and
  invites partners to negotiate a revision. No number, no window, no scope and no response headers
  are published anywhere in the developer portal, so an integrator cannot size a workload — or an
  agent budget a call sequence — without first signing a contract. What IS published is the failure
  signal: HTTP 429 is listed as a global error both APIs can return on any endpoint.
