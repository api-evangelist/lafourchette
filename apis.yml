aid: lafourchette
name: LaFourchette
description: 'LA FOURCHETTE SAS, trading as TheFork, is the European restaurant-booking and restaurant-management
  platform founded in Paris in 2007 and acquired by TripAdvisor in 2014. It runs the consumer marketplace
  at thefork.com across a dozen European markets and the TheFork Manager (TFM) SaaS that restaurants use
  for reservations, table and floor management, reviews, loyalty ("Yums"), preset menus and payments.
  Its developer surface is published at docs.thefork.io and consists of two REST APIs: the B2B / Partners
  API (api.thefork.io/manager) used by restaurant groups, CRM platforms and booking-funnel partners to
  read customers, reservations and reviews and to drive availabilities, offers, timeslots and reservation
  lifecycle; and the POS API v1 (api.thefork.io/pos) used by point-of-sale vendors to register a POS instance
  and push closed-bill data back onto a reservation. A push webhook flow delivers customer, reservation
  and review events to partner endpoints. Credentials are issued by the integrations team; the B2B API
  uses an Auth0 client-credentials access token and the POS API an X-Api-Key header.'
