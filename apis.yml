apis:
- aid: lafourchette:thefork-b2b-api
  name: TheFork B2B API
  description: Partners API for TheFork Manager. Read customers, reservations and reviews; drive the booking
    funnel with availabilities, offers, party sizes and timeslots; create, update and cancel reservations;
    reply to reviews; and post call-centre caller recognitions. Access is granted by TheFork's integrations
    team and authenticated with an Auth0 client-credentials access token presented as a bearer token against
    audience https://api.thefork.io.
  humanURL: https://docs.thefork.io/B2B-API/introduction
  baseURL: https://api.thefork.io/manager
