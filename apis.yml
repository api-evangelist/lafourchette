- aid: lafourchette:thefork-pos-api
  name: TheFork POS API v1
  description: Point-of-sale integration API for TheFork Manager. A POS vendor registers its POS instance,
    uploads a logo, receives an order-open webhook when a diner is seated, and closes the order back to
    TheFork with the bill lines, currency and total so spend data is attached to the reservation. Authenticated
    with an API key in the X-Api-Key header.
  humanURL: https://docs.thefork.io/POS-API/introduction
  baseURL: https://api.thefork.io/pos
