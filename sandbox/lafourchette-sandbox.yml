generated: '2026-08-17'
method: searched
source: https://docs.thefork.io/POS-API/First%20setup/create-pos
docs:
- https://docs.thefork.io/POS-API/First%20setup/create-pos
- https://docs.thefork.io/POS-API/First%20setup/update-logo
- https://docs.thefork.io/POS-API/goto-production
