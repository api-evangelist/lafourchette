note: >-
  One real hit. The Auth0 tenant behind TheFork's B2B API is served on TheFork's own domain
  (auth.thefork.io) and answers OIDC discovery anonymously at both /.well-known/openid-configuration
  and /.well-known/oauth-authorization-server, which is what the B2B docs point at for the
  client-credentials token exchange. Everything else 404s or is refused. docs.thefork.io is a static
  S3/CloudFront origin that answers 403 (AccessDenied XML) for any missing key rather than 404 —
  recorded here as the status actually observed, not translated. www.thefork.com sits behind DataDome
  and answers 403 on the site root, but returns a genuine origin 404 for /.well-known/* paths, so the
  absence there is real and not a bot wall. api.thefork.io is an authenticated gateway that answers
  403 to every anonymous path.
