note: >-
  TheFork ships NO client library for either of its APIs, in any language. The docs teach the API in
  raw curl only and never mention an SDK. What does exist under the lafourchette vendor namespace on
  Packagist is a set of first-party Symfony bundles the company open-sourced between 2012 and 2017 —
  internal platform plumbing (impersonation, localization, PagerDuty, breadcrumbs, an Adobe Campaign
  client, a Talend client), none of which wraps TheFork's own API. They are listed because they are
  genuinely first-party and they date the company's open-source posture, but they must not be read as
  SDK coverage: no `SDKs` pointer is wired in apis.yml, because none of these packages helps anyone
  call api.thefork.io. Every one of them is dormant — the newest release is 2017-04-28, nine years
  before this pass, and one is flagged abandoned on Packagist.
