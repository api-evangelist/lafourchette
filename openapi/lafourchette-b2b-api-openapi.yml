        name: date
        in: query
      - schema:
          type: string
          format: uuid
          description: offer uuid that may be considered for filter
          example: a114c986-9d5b-4c34-a86b-427137dae3d4
        required: false
        description: offer uuid that may be considered for filter
        name: offerUuid
        in: query
      - schema:
          type: number
          minimum: 0
