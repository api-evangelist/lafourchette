          description: Object with user data.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    datetime:
                      type: string
                      nullable: true
                      description: Date and time of the timeslot
                      example: '2022-01-01T12:30:00+01:00'
                    offers:
                      type: array
                      nullable: true
                      items:
                        type: string
                        format: uuid
