                    type: string
                    nullable: true
                  allergiesAndIntolerances:
                    type: array
                    nullable: true
                    items:
                      type: string
                      example: seafood
                  dietaryRestrictions:
                    type: array
                    nullable: true
                    items:
                      type: string
                      example: gluten_free
                  spendingBehaviour:
                    type: array
                    nullable: true
                    items:
                      type: string
                      example: promo_seeker
                  customerRelationship:
                    type: array
                    nullable: true
                    items:
                      type: string
                      example: employee
                  riskLevel:
                    type: array
                    nullable: true
                    items:
                      type: string
                      example: caution
                  otherTags:
                    type: array
                    nullable: true
                    items:
                      type: string
                      example: wine_lover
                  favFood:
                    type: string
                    nullable: true
                    example: Burger
                  favDrinks:
                    type: string
                    nullable: true
                    example: Punk IPA
                  favSeating:
                    type: string
                    nullable: true
                    example: Terrace
                  notes:
                    type: string
                    nullable: true
                  originRestaurantUuid:
                    type: string
                    nullable: true
                    example: ddc14c13-98ce-4ece-9c82-98f84050f6f5
                  originRestaurantName:
                    type: string
                    nullable: true
                    example: 587850fc-abd7-4486-a61a-aa05b2fbba84
                  creationDate:
                    type: string
                    nullable: true
                    description: Creation date
                    example: '2022-09-02'
                  lastUpdateDate:
                    type: string
                    nullable: true
                    description: Last update date
                    example: '2022-09-30'
                  isPromoter:
                    type: boolean
                  secondaryPhone:
                    type: string
                    nullable: true
                  country:
                    type: string
                    nullable: true
                    example: FR
                  city:
                    type: string
                    nullable: true
                    example: Paris
                  zipcode:
                    type: string
                    nullable: true
                    example: '75001'
                  optins:
                    type: object
                    properties:
                      restaurantNewsletter:
                        type: boolean
                        default: false
                        description: Optin the diner to the restaurant newsletter, when false is provided it will not unsubscribe
                          the diner
                        example: true
                    default:
                      restaurantNewsletter: false
                    additionalProperties: false
                  customFields:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        labelUuid:
                          type: string
                          format: uuid
                          description: Label UUID
                          example: 55749b38-b822-4ece-b976-65a1458c6d47
                        label:
                          type: string
                          description: Label value
                          example: Regular lunch customer
                        type:
                          type: string
                          enum:
                          - boolean
                          - string
                          - integer
                        value:
                          anyOf:
                          - type: string
                          - type: boolean
                          - type: number
                          - type: string
                            enum:
                            - ''
                          description: Custom field value
                          example: true
                        valueUuid:
                          type: string
                          nullable: true
                          format: uuid
                          description: Value UUID
                          example: ada0f099-4e3d-47da-addd-1d449082fc34
