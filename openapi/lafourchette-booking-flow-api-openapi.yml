  /v1/restaurants/{id}/availabilities/override:
    put:
      operationId: putV1RestaurantsIdAvailabilitiesOverride
      tags:
      - Booking flow
      description: Override online availability for a given restaurant, date, and time range.
      parameters:
      - schema:
          type: string
          format: uuid
          description: Restaurant UUID
          example: c564869f-225a-4cb6-b124-2214a6216ec1
        required: true
        description: Restaurant UUID
        name: id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: Date to override availability for (YYYY-MM-DD)
                  example: '2026-06-01'
                startTime:
                  type: string
                  description: First timeslot start to close/open (HH:mm, inclusive)
                  example: '19:00'
                endTime:
                  type: string
                  description: Last timeslot start to close/open (HH:mm, inclusive). If omitted, applies only to startTime. The affected interval is [startTime, endTime + slot spacing), so the slot starting at endTime is included.
                  example: '21:30'
                isOpen:
                  type: boolean
                  default: false
                  description: true = open, false = close
                  example: false
              required:
              - date
              - startTime
              additionalProperties: false
      responses:
        '200':
          description: Object with user data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurantUuid:
                    type: string
                    format: uuid
                    example: c564869f-225a-4cb6-b124-2214a6216ec1
                  date:
                    type: string
                    format: date
                    example: '2026-06-01'
                  startTime:
                    type: string
                    example: '19:00'
                  endTime:
                    type: string
                    example: '21:30'
                  isOpen:
                    type: boolean
                    example: false
                required:
                - restaurantUuid
                - date
                - startTime
                - endTime
                - isOpen
                additionalProperties: false
        '401':
          description: Object with user data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - ''
                    required:
                    - code
                  error:
                    type: string
                    enum:
                    - Unauthorized
                  statusCode:
                    type: number
                    enum:
                    - 401
                required:
                - data
                - error
                - statusCode
        '404':
          description: Object with user data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
