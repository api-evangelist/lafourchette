  /v1/restaurants/{id}/timeslots:
    get:
      operationId: getV1RestaurantsIdTimeslots
      tags:
      - Booking flow
      description: Get list of time slots for a given restaurant and date.
      parameters:
      - schema:
          type: string
          format: uuid
          description: restaurant uuid that needs to be considered for filter
          example: c564869f-225a-4cb6-b124-2214a6216ec1
        required: true
        description: restaurant uuid that needs to be considered for filter
        name: id
        in: path
      - schema:
          type: string
          format: date
          description: date that needs to be considered for filter
          example: '2022-01-01'
        required: true
        description: date that needs to be considered for filter
        name: date
        in: query
      - schema:
          type: string
          format: uuid
          description: offer uuid that may be considered for filter
          example: a114c986-9d5b-4c34-a86b-427137dae3d4
        required: false
        description: offer uuid that may be considered for filter
        name: offerUuid
        in: query
      - schema:
          type: number
          description: party size that may be considered for filter
          example: 2
          exclusiveMinimum: 0
        required: false
        description: party size that may be considered for filter
        name: partySize
        in: query
      responses:
        '200':
          description: Object with user data.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    datetime:
                      type:
                      - string
                      - 'null'
                      description: Date and time of the timeslot
                      example: '2022-01-01T12:30:00+01:00'
                    offers:
                      type:
                      - array
                      - 'null'
                      items:
                        type: string
                        format: uuid
                        example: a114c986-9d5b-4c34-a86b-427137dae3d4
                      description: List of offer uuids linked to the timeslot
                    hasNormalStock:
                      type: boolean
                      description: Has availability for reservation without offer
                      example: true
                    hasPaymentGuaranteeRequirement:
                      type: boolean
                      description: This timeslot requires a payment guarantee. If true at least one offer and/or the normal stock is protected by a guarantee requirement
                      example: true
                    guaranteeRequirementList:
                      type: array
                      items:
                        type: object
                        properties:
                          guaranteeType:
                            type: string
                            enum:
                            - imprint
                            - prepayment
                            example: imprint
                          amount:
                            type: integer
                            minimum: 0
                            description: amount of the guarantee (in euros)
                            example: 10
                          minimumCancellationHours:
                            type: integer
                            description: minimum amount of hours needed before the mealdate in case of cancellation
                            example: 24
                          minimumPartySize:
                            type: integer
                            description: minimum party size for which this guarantee requirement applies. If it applies to all party sizes, minimumPartySize will be equal to 0
                            example: 2
                          offerUuid:
                            type: string
                            format: uuid
                            description: offer uuid linked to the guarantee requirement. If no offerUuid is present, we are dealing with the normal stock
                        required:
                        - guaranteeType
                        - amount
                        - minimumCancellationHours
                        - minimumPartySize
                        additionalProperties: false
                      description: Detail of the guarantee requirement (will have at least 1 object if the hasPaymentGuaranteeRequirement is true)
                  required:
                  - datetime
                  - hasNormalStock
                  - hasPaymentGuaranteeRequirement
                  - guaranteeRequirementList
                  additionalProperties: false
        '401':
          description: Object with user data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - ''
                    required:
                    - code
                  error:
                    type: string
                    enum:
                    - Unauthorized
                  statusCode:
                    type: number
                    enum:
                    - 401
                required:
                - data
                - error
                - statusCode
        '404':
          description: Object with user data.
          content:
            application/json:
              schema:
                type: object
