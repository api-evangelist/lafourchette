  /v1/restaurants/{id}/reservations:
    post:
      operationId: postV1RestaurantsIdReservations
      tags:
      - Booking flow
      description: Create a reservation for a given restaurant, with all details (meal date, party size and customer data).
      parameters:
      - schema:
          type: string
          format: uuid
          description: restaurant uuid that needs to be considered for filter
          example: c564869f-225a-4cb6-b124-2214a6216ec1
        required: true
        description: restaurant uuid that needs to be considered for filter
        name: id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
